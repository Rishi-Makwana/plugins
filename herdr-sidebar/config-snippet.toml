
# herdr-sidebar: append to ~/.config/herdr/config.toml, then replace YOUR-SITE URLs.

[ui.sidebar.custom]
title = "stats"
command = "~/.config/herdr/sidebar-stats.sh"
interval_seconds = 5
timeout_seconds = 2
max_rows = 8

# Icons are Nerd Font glyphs; the terminal font must be a Nerd Font.
[[ui.sidebar.launchers]]
icon = ""
label = "Chrome"
command = "open -a 'Google Chrome'"

[[ui.sidebar.launchers]]
icon = ""
label = "Confluence"
command = "open -a 'Google Chrome' 'https://YOUR-SITE.atlassian.net/wiki'"

[[ui.sidebar.launchers]]
icon = "\U000f0a1e"
label = "VS Code"
command = "open -a 'Visual Studio Code'"

[[ui.sidebar.launchers]]
icon = ""
label = "Jira"
command = "open -a 'Google Chrome' 'https://YOUR-SITE.atlassian.net/jira'"

[[ui.sidebar.launchers]]
icon = ""
label = "GitHub"
command = "open -a 'Google Chrome' 'https://github.com'"
